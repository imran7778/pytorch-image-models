# ConvNeXt V2 Nano classifier parameters. Dataset locations belong in the
# copied data YAML and must not be rewritten for local testing.

# cd /mnt/ssd2/workstation-96/pytorch-model

# python prepare_yolo_crop_dataset.py --config configs/convnextv2_nano_yolo_crops.yaml --environment local
# python train_yolo_crop_classifier.py --config configs/convnextv2_nano_yolo_crops.yaml --environment local

# python prepare_yolo_crop_dataset.py --config configs/convnextv2_nano_yolo_crops.yaml --environment server
# python train_yolo_crop_classifier.py --config configs/convnextv2_nano_yolo_crops.yaml --environment server
# python train_server.py

#
# Export ONNX and TensorRT:
# python export_crop_classifier.py --config configs/convnextv2_nano_yolo_crops.yaml --environment local
# python export_crop_classifier.py --config configs/convnextv2_nano_yolo_crops.yaml --environment server

environments:
  local:
    project_root: /mnt/ssd2/workstation-96/pytorch-model
    export_root: /mnt/ssd2/workstation-96/export_models
    source_dataset: /mnt/ssd2/workstation-96/data/Unified_Grayscale_Dataset
    prepared_dataset: /mnt/ssd2/workstation-96/data/crops
  server:
    project_root: /home/imran.ahmed/projects/pytorch-model
    export_root: /home/imran.ahmed/projects/export_models
    source_dataset: /shared/data/nt_drone_dataset_all_sizes/Unified_Grayscale_Dataset
    prepared_dataset: /home/imran.ahmed/projects/repo_pytorch/crops

# These keys are selected in memory from environments.local/server so existing
# export interpolation remains portable. Do not edit them per machine.
project_root: ${environments.local.project_root}
export_root: ${environments.local.export_root}
ex_name: DINO_base_v1
model:
  name: vit_base_patch16_dinov3.lvd1689m # vit_base_patch16_dinov3.lvd1689m #convnextv2_nano
  pretrained: true
  input_size: 256
  num_classes: 4

# vit_small_patch16_dinov3.lvd1689m
# vit_small_plus_patch16_dinov3.lvd1689m
# vit_base_patch16_dinov3.lvd1689m
# vit_large_patch16_dinov3.lvd1689m
# vit_huge_plus_patch16_dinov3.lvd1689m
# vit_7b_patch16_dinov3.lvd1689m

data:
  yaml: configs/data/common_drone_rgb.yaml
  # Source/prepared locations come from the selected environment above.
  crop_expansion: 3.20
  min_crop_pixels: 2
  val_fraction_if_lists_missing: 0.10

training:
  output_dir: runs/${ex_name}
  epochs: 500
  # Safe default for an 8 GiB GPU. Increase only after checking free VRAM.
  batch_size: 256
  workers: 8
  optimizer: adamw
  learning_rate: 0.00002
  weight_decay: 0.05
  label_smoothing: 0.1
  amp: true
  device: cuda
  seed: 42
  save_every: 10
  verbose: true
  max-train-samples: all
  max-val-samples: all

export:
  enabled: true
  export_onnx: true
  export_engine: true

  # This training run currently has last.pt. Change only this value to best.pt
  # when a best checkpoint is available.
  checkpoint: ${project_root}/${training.output_dir}/best.pt
  output_dir: ${export_root}/${ex_name}
  filenames:
    # Keep the portable transformer ONNX in FP32. TensorRT still builds the
    # optimized engine with FP16 kernels according to engine_args.precision.
    onnx: best_fp32.onnx
    engine: best_fp16.engine

  common_args:
    device: 0
    input_size: ${model.input_size}
    input_channels: 3 # always 3 for RGB; grayscale images are converted to 3 channels
    num_classes: ${model.num_classes}
    opset: 18  # Recommended for DINOv3 transformer/RoPE ONNX operators.
    dynamic_batch: true
    dynamic_spatial: false
    simplify: true
    verbose: false  # true prints the complete ONNX graph (thousands of lines).

  onnx_args:
    precision: fp32  # Safe portable graph; TensorRT engine precision is configured separately.
    batch: 1  # Example batch used only to trace and verify the ONNX graph.
    input_name: images
    output_name: logits
    verify: true
    provider: cuda  # cuda or cpu
    require_gpu: true
    # FP32 ONNX logits should closely match the PyTorch checkpoint.
    atol: 0.01
    rtol: 0.03

  engine_args:
    precision: fp16  # fp32 or fp16; int8 requires a calibration implementation
    workspace_gb: 4 # no need to match with yolo export, it is the maximum workspace size TensorRT can use
    min_batch: 1
    opt_batch: 8
    max_batch: 32 # should be greater or equal to max_det: 10 in yolo export
    builder_optimization_level: 5
    hardware_compatibility: none
    profiling_verbosity: layer_names_only
    timing_cache: true
    verify: true
